# Tells the package repositories and winget when the
# maintainer publishes a release (#165). The work is oxiguitar-packages' reusable
# workflow plugin-publish.yml: it checks the release holds every file and
# sum, then sends the event. It needs the secrets PACKAGES_TOKEN and
# WINGET_TOKEN; without them nothing is sent and the run says so.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    uses: mateusrdp/oxiguitar-packages/.github/workflows/plugin-publish.yml@main
    with:
      name: wav
      tag: ${{ inputs.tag }}
      # Not submitted to winget yet (no third parties for now): put the id back to turn it on.
      # winget-id: mateusrdp.OxiGuitar.WAV
    secrets: inherit
