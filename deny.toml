# cargo-deny configuration. CI fails on any dependency whose license is not
# listed here, on known security advisories, and on crates from unknown sources.
# Every license below is compatible with GPL-3.0 (see CREDITS.md).

[graph]
all-features = true
# The six targets we build and ship. Without this list cargo-deny also counts
# dependencies no build of ours compiles, such as rav1e's libfuzzer-sys, which
# exists only under `cfg(fuzzing)`.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
]

[licenses.private]
# Our own crates are checked like any other.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# OxiGuitar's SDK, by git tag (nothing of ours is on crates.io).
allow-git = ["https://github.com/mateusrdp/oxiguitar"]
